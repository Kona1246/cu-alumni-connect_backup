<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CU Alumni Connect — University of Calcutta Alumni Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
(function(){
  if (!Object.fromEntries) Object.fromEntries = function (it) { var o = {}; Array.from(it).forEach(function (p) { o[p[0]] = p[1]; }); return o; };
  var ok = window.Promise && window.fetch && window.Response && window.FormData && Array.from && Object.assign;
  window.__CU_OLD = !ok;
  if (ok) return;
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.setAttribute('style', 'background:#b3261e;color:#fff;padding:10px 16px;font:14px/1.4 system-ui,sans-serif;text-align:center');
    d.textContent = 'This browser is too old to run CU Alumni Connect. Please use a current version of Chrome, Edge, Firefox or Safari.';
    document.body.insertBefore(d, document.body.firstChild);
  });
})();
</script>
<noscript><div style="background:#b3261e;color:#fff;padding:10px 16px;text-align:center">Please enable JavaScript to use CU Alumni Connect.</div></noscript>
</head>
<body>
<div id="appRoot"></div>
<template id="tpl-member"><header>
  <div class="bar">
    <a class="brand" href="#home"><div class="emblem">CU</div><div><b>CU Alumni Connect</b><small>UNIVERSITY OF CALCUTTA ALUMNI NETWORK</small></div></a>
    <div class="who" id="who"></div>
  </div>
  <nav id="nav">
    <a href="#home" data-v="home">Home</a>
    <a href="#notices" data-v="notices">Notifications<span class="dot" id="ndot" hidden></span></a>
    <a href="#chat" data-v="chat">Alumni Chat</a>
    <a href="#feedback" data-v="feedback">Feedback &amp; Suggestions</a>
    <a href="#admin" data-v="admin">Administration</a>
    <a href="#depts" data-v="depts">Departments &amp; Faculty</a>
    <a href="#join" data-v="join" id="joinLink">Register / Sign in</a>
    <a href="#profile" data-v="profile" id="profileLink" class="hidden">My profile</a>
    <a href="#staff" style="margin-left:auto">Staff login</a>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="hero">
      <div>
        <span class="tag" style="background:var(--gold-l);color:#7a5c12">Est. 1857 · Verified alumni only</span>
        <h1 style="margin-top:12px">Reconnect with your University, your batch and your department.</h1>
        <p>Register with your name, University registration number and year of registration. Once your record is verified you can receive official notices, chat with fellow alumni and send suggestions to the University.</p>
        <div class="cta"><a class="btn" href="#join">Register as alumni</a><a class="btn ghost" href="#notices">View notifications</a></div>
      </div>
      <div class="stats">
        <div class="card stat"><b id="sNotices">–</b><span>Active notifications</span></div>
        <div class="card stat"><b id="sDepts">–</b><span>Departments &amp; centres</span></div>
        <div class="card stat"><b id="sFaculty">–</b><span>Faculty listed</span></div>
        <div class="card stat"><b id="sOfficials">–</b><span>Officers &amp; governing members</span></div>
      </div>
    </div>
    <div class="feats">
      <a class="card feat" href="#join"><div class="ic">🎓</div><h3>Verified registration</h3><p>Name, registration number and year are checked against University records.</p></a>
      <a class="card feat" href="#notices"><div class="ic">📢</div><h3>Notifications</h3><p>Convocation, certificates, events and circulars posted by the University.</p></a>
      <a class="card feat" href="#chat"><div class="ic">💬</div><h3>Alumni chat</h3><p>Common lounge, batch and department rooms, and private messages.</p></a>
      <a class="card feat" href="#feedback"><div class="ic">💡</div><h3>Feedback &amp; suggestions</h3><p>Propose ideas for academic upgradation and track the University's response.</p></a>
      <a class="card feat" href="#admin"><div class="ic">🏛️</div><h3>Administration</h3><p>Officers and governing bodies with email and mobile contacts.</p></a>
      <a class="card feat" href="#depts"><div class="ic">🔬</div><h3>Departments &amp; faculty</h3><p>Every department and centre, faculty specialisations and addresses.</p></a>
    </div>
    <div class="sec-h"><h2>Latest from the University</h2><a href="#notices">All notifications →</a></div>
    <div id="homeNotices"></div>
  </section>

  <!-- NOTIFICATIONS -->
  <section class="view" id="v-notices">
    <div class="sec-h"><div><h2>Notifications</h2><div class="sub">Posted by the University</div></div>
      <input id="nsearch" placeholder="Search notifications…" style="max-width:260px"></div>
    <div class="filters" id="filters"></div>
    <div id="noticeList"></div>
  </section>

  <!-- REGISTER / SIGN IN -->
  <section class="view" id="v-join">
    <div class="reg">
      <div class="card pad">
        <div class="tabs"><button class="on" data-act="tab" data-t="r">Register as alumni</button><button data-act="tab" data-t="s">Member sign in</button></div>
        <form id="t-r" autocomplete="off">
          <div class="msg" id="rmsg"></div>
          <div class="field"><label for="rname">Full name (as in University records)</label><input id="rname" required></div>
          <div class="grid2">
            <div class="field"><label for="rreg">University registration no.</label><input id="rreg" required><div class="hint">As printed on your registration certificate, e.g. <span class="regex"></span></div></div>
            <div class="field"><label for="ryear">Year of registration</label><select id="ryear" required></select></div>
          </div>
          <div class="verify" id="vbox"><span>🔎</span><span id="vtext">Enter your name, registration number and year, then verify against University records.</span></div>
          <button type="button" class="btn ghost" id="vbtn" data-act="verify">Verify with University records</button>
          <div id="rmore" class="hidden" style="margin-top:18px">
            <div class="grid2">
              <div class="field"><label>Subject / department (from record)</label><input id="rsubj" readonly></div>
              <div class="field"><label>College (from record)</label><input id="rcoll" readonly></div>
              <div class="field"><label for="remail">Email</label><input id="remail" type="email" autocomplete="email"></div>
              <div class="field"><label for="rmob">Mobile (optional)</label><input id="rmob" placeholder="+91" autocomplete="tel"></div>
              <div class="field"><label for="rorg">Current city / organisation (optional)</label><input id="rorg"></div>
              <div></div>
              <div class="field"><label for="rpw">Create password</label><input id="rpw" type="password" autocomplete="new-password"><div class="hint">At least 8 characters</div></div>
              <div class="field"><label for="rpw2">Confirm password</label><input id="rpw2" type="password" autocomplete="new-password"></div>
            </div>
            <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px;margin-bottom:14px"><input type="checkbox" id="ragree" style="width:auto;margin-top:3px"> I confirm I am the person named on these University records and agree to the community guidelines.</label>
            <button type="submit" class="btn">Complete registration</button>
          </div>
        </form>
        <form id="t-s" class="hidden">
          <div class="msg" id="smsg"></div>
          <div class="field"><label for="sid">Registration no. or email</label><input id="sid" autocomplete="username"></div>
          <div class="field"><label for="spw">Password</label><input id="spw" type="password" autocomplete="current-password"></div>
          <button class="btn" type="submit">Sign in</button>
          <p class="hint" style="margin-top:12px">Forgot your password? Contact the Alumni Cell; staff can issue a temporary password.</p>
          <p class="hint">University staff? <a href="#staff">Sign in to the staff console</a>.</p>
        </form>
      </div>
      <div class="card pad">
        <h3 style="font-size:18px;margin-bottom:6px">How verification works</h3>
        <p class="muted" style="font-size:13.5px;margin-top:0">All three details must match one University record: your name, your registration number and your year of registration. Each registration number can be claimed only once.</p>
        <p class="muted" style="font-size:13.5px">If anything doesn't match, you'll be told which check failed, but the details on file are never shown. If you believe the records are wrong, contact the Alumni Cell for manual verification.</p>
        <p class="muted" style="font-size:13.5px">Your name, subject and college are taken from the University record and can't be edited, so every member is who they say they are.</p>
      </div>
    </div>
  </section>

  <!-- PROFILE -->
  <section class="view" id="v-profile">
    <div class="card pad" style="max-width:640px">
      <h2 style="font-size:24px;margin-bottom:4px">My profile</h2>
      <p class="muted" id="profSummary" style="margin-top:0"></p>
      <form id="profForm">
        <div class="msg" id="prmsg"></div>
        <div class="grid2">
          <div class="field"><label for="pmob">Mobile</label><input id="pmob"></div>
          <div class="field"><label for="porg">City / organisation</label><input id="porg"></div>
          <div class="field"><label for="pcur">Current password (to change password)</label><input id="pcur" type="password" autocomplete="current-password"></div>
          <div class="field"><label for="pnew">New password</label><input id="pnew" type="password" autocomplete="new-password"></div>
        </div>
        <button class="btn" type="submit">Save changes</button>
      </form>
    </div>
  </section>

  <!-- CHAT -->
  <section class="view" id="v-chat">
    <div id="chatGate" class="card gate">
      <h3>Members-only chat</h3>
      <p class="muted">The alumni chat is open to verified members. Register with your University details, or sign in if you're already a member.</p>
      <a class="btn" href="#join">Register or sign in</a>
    </div>
    <div id="chatApp" class="card chat hidden">
      <aside><h4>Rooms</h4><div id="rooms"></div><h4>Direct messages</h4><div id="dms"></div></aside>
      <div class="pane">
        <div class="phead"><b id="roomTitle"></b><div class="muted" style="font-size:13px" id="roomSub"></div></div>
        <div class="stream" id="stream"></div>
        <div class="typing" id="typing"></div>
        <form class="compose" id="compose"><input id="cin" placeholder="Write a message…" autocomplete="off" maxlength="2000"><button class="btn">Send</button></form>
      </div>
      <aside class="r"><h4>Members</h4><input id="msearch" placeholder="Find a member…" style="margin:0 0 8px;padding:7px 10px;font-size:13px"><div id="members"></div></aside>
    </div>
  </section>

  <!-- FEEDBACK -->
  <section class="view" id="v-feedback">
    <div class="sec-h"><div><h2>Feedback &amp; Suggestions</h2><div class="sub">Alumni proposals to the University authority for academic upgradation</div></div></div>
    <div id="fbGate" class="card gate">
      <h3>Verified members only</h3>
      <p class="muted">To keep feedback authentic, only registered alumni can submit and view suggestions.</p>
      <a class="btn" href="#join">Register or sign in</a>
    </div>
    <div class="fb hidden" id="fbApp">
      <form class="card pad" id="fbForm">
        <h3 style="font-size:19px;margin-bottom:12px">Submit a suggestion</h3>
        <div class="msg" id="fmsg"></div>
        <div class="field"><label for="fcat">Area</label><select id="fcat"></select></div>
        <div class="field"><label for="fdept">Department / centre concerned</label><select id="fdept"></select></div>
        <div class="field"><label for="ftitle">Title</label><input id="ftitle" maxlength="160" placeholder="One-line summary of your suggestion"></div>
        <div class="field"><label for="fbody">Feedback &amp; suggestion</label><textarea id="fbody" rows="7" maxlength="5000" placeholder="What is the current gap, what do you suggest, and how could it be implemented?"></textarea></div>
        <div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="fshare" style="width:auto" checked> Show on the suggestions board so other members can support it</label></div>
        <button class="btn" style="width:100%" type="submit">Send to University authority</button>
      </form>
      <div>
        <div class="filters" id="fbTabs"></div>
        <div id="fbList"></div>
      </div>
    </div>
  </section>

  <!-- ADMINISTRATION -->
  <section class="view" id="v-admin">
    <div class="sec-h"><div><h2>Administration &amp; Governing Bodies</h2><div class="sub">Contact details of the University's officers and governing bodies</div></div>
      <input id="osearch" placeholder="Search name or designation…" style="max-width:260px"></div>
    <div id="officials"></div>
  </section>

  <!-- DEPARTMENTS -->
  <section class="view" id="v-depts">
    <div class="sec-h"><div><h2>Departments, Centres &amp; Faculty</h2><div class="sub">Faculty members, their specialisations and communication addresses</div></div>
      <input id="dsearch" placeholder="Search department, faculty or specialisation…" style="max-width:340px"></div>
    <div class="filters" id="dfilters"></div>
    <div class="deps">
      <div class="card"><div class="dlist" id="dlist"></div></div>
      <div class="card" id="ddetail"></div>
    </div>
  </section>
</main>
<footer>CU Alumni Connect · University of Calcutta · <a href="#staff">University staff console</a></footer>
<div class="toast" id="toast"></div></template>
<template id="tpl-staff"><header>
  <div class="bar" style="padding-bottom:12px">
    <a class="brand" href="#staff"><div class="emblem">CU</div><div><b>Staff Console</b><small>CU ALUMNI CONNECT · UNIVERSITY AUTHORITY</small></div></a>
    <div class="who" id="who"><a href="#home" style="color:#f0d9dc">Open member portal ↗</a></div>
  </div>
</header>

<main>
  <div id="login" class="card pad login-wrap hidden">
    <h2 style="font-size:24px;margin-bottom:4px">University staff sign-in</h2>
    <p class="muted" style="margin-top:0;font-size:14px">For authorised staff who manage notifications, feedback, student records and directories.</p>
    <form id="loginForm">
      <div class="msg" id="lmsg"></div>
      <div class="field"><label for="lu">Staff ID</label><input id="lu" autocomplete="username"></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>

  <div id="console" class="console hidden">
    <div class="card side-nav" id="sideNav"></div>
    <div id="panel"></div>
  </div>
</main>
<div class="toast" id="toast"></div></template>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
